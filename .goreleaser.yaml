version: 2

project_name: revier

builds:
  - id: revier
    main: ./cmd/revier
    binary: revier
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hk9890/revier/internal/build.Version={{ .Version }}
      - -X github.com/hk9890/revier/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/hk9890/revier/internal/build.Date={{ .Date }}
    # Linux only: the window host revier ships (GNOME) and its desktop keys
    # are a Linux desktop's.
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: revier-archives
    ids:
      - revier
    formats:
      - tar.gz
    # The binary alone: the desktop keys run `revier popup` and `revier go`.
    # A pattern that matches nothing replaces GoReleaser's default of adding
    # README, LICENSE and CHANGELOG.
    files:
      - none*
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  # Re-dispatching against an existing tag replaces its assets instead of
  # failing (docs/RELEASING.md).
  replace_existing_artifacts: true

# The release notes are the version's CHANGELOG.md section, passed with
# --release-notes (scripts/release-notes), not a commit list. The changelog
# pipe is what reads that file, so it must stay enabled: `changelog.disable`
# skips the pipe and publishes a release with an empty body. A notes file
# suppresses the commit list on its own.

signs:
  - cmd: cosign
    artifacts: checksum
    # The keyless certificate is tracked as an artifact so ${certificate} is
    # defined and the .pem ships beside the .sig; verification needs both.
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "${artifact}"
      - "--output"
      - "spdx-json=${document}"
