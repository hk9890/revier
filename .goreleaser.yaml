version: 2

project_name: revier

# The licence texts of everything the static binary links: each third-party
# module's, then the Go standard library's, which go-licenses leaves out. The
# archives carry them, so each run writes them and no commit holds them.
before:
  hooks:
    # go-licenses is no dependency of revier, so it gets neither the token nor
    # the signing identity of the release run. CGO_ENABLED is the builds'.
    - env -u GITHUB_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL CGO_ENABLED=0 go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/revier --save_path third_party_licenses --force --ignore github.com/hk9890/revier
    - sh -c 'mkdir third_party_licenses/go && cp "$(go env GOROOT)/LICENSE" third_party_licenses/go/LICENSE'

builds:
  - id: revier
    main: ./cmd/revier
    binary: revier
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hk9890/revier/internal/build.Version={{ .Version }}
      - -X github.com/hk9890/revier/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/hk9890/revier/internal/build.Date={{ .Date }}
    # Linux only: the window host revier ships (GNOME) and its desktop keys
    # are a Linux desktop's.
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: revier-archives
    ids:
      - revier
    formats:
      - tar.gz
    # The binary and the licence notices that MIT and BSD-3-Clause ask every
    # copy to carry: revier's own, and those the `before` hooks write. Naming
    # the files replaces GoReleaser's default of adding README and CHANGELOG
    # as well.
    files:
      - src: LICENSE
        info: &root_owned
          owner: root
          group: root
          mode: 0644
      - src: third_party_licenses/**/*
        info: *root_owned
    # Owned by root, not by the user the release ran as: tar keeps the
    # recorded owner when root extracts.
    builds_info:
      owner: root
      group: root
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  # Re-dispatching against an existing tag replaces its assets instead of
  # failing (docs/RELEASING.md).
  replace_existing_artifacts: true

# The release notes are the version's CHANGELOG.md section, passed with
# --release-notes (scripts/release-notes), not a commit list. The changelog
# pipe is what reads that file, so it must stay enabled: `changelog.disable`
# skips the pipe and publishes a release with an empty body. A notes file
# suppresses the commit list on its own.

signs:
  - cmd: cosign
    artifacts: checksum
    # The keyless certificate is tracked as an artifact so ${certificate} is
    # defined and the .pem ships beside the .sig; verification needs both.
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

sboms:
  - artifacts: archive
    cmd: syft
    args:
      - "${artifact}"
      - "--output"
      - "spdx-json=${document}"
