name: Release

# Releases are published by dispatching this workflow by hand against a release
# tag (docs/RELEASING.md). workflow_dispatch rather than `push: tags: v*` so
# that re-tagging or history maintenance cannot publish a release by accident.
on:
  workflow_dispatch:

# Least-privilege default; the release job widens itself.
permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release notes and asset upload
      id-token: write       # cosign keyless signing and SLSA attestation OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `go build ./...` writes no binary. A binary at the repository root
      # leaves the tree dirty, and GoReleaser refuses a dirty tree.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: L1 + L2
        run: CGO_ENABLED=1 go test -race ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 defaults to --new-bundle-format, which rejects the
          # --output-signature/--output-certificate flags in .goreleaser.yaml.
          cosign-release: 'v2.6.3'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA build provenance for release archives
        # Best-effort: attestation is unavailable on user-owned private
        # repositories, and the release is already published by the step
        # above. It starts working if the repository goes public or org-owned.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
