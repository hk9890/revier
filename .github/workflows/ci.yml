name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default token: build, test and lint need read access only.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked in the Lint job, which already has mise. It cannot
      # run here: mise-action exports .mise.toml's [env], including
      # CGO_ENABLED=0, into the job - and the race detector needs cgo.

      - name: vet (every build tag)
        run: go vet ./... && go vet -tags=integration ./... && go vet -tags=live ./...

      - name: L1 + L2
        run: CGO_ENABLED=1 go test -race ./...

      - name: L3 adapter parsing
        run: CGO_ENABLED=1 go test -race -tags=integration ./...

      # herdr is pinned, unlike tmux: it is pre-1.0 and the host checks its
      # release, not its API's protocol, so a new release is taken on purpose,
      # with new fixtures (herdr-latest.yml runs the latest one weekly). The
      # digest is the one GitHub lists for the release asset.
      - name: Install herdr
        env:
          HERDR_VERSION: v0.9.5
          HERDR_SHA256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        run: |
          mkdir -p "$RUNNER_TEMP/herdr"
          curl -fsSL -o "$RUNNER_TEMP/herdr/herdr" "https://github.com/herdrdev/herdr/releases/download/$HERDR_VERSION/herdr-linux-x86_64"
          echo "$HERDR_SHA256  $RUNNER_TEMP/herdr/herdr" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/herdr/herdr"
          echo "$RUNNER_TEMP/herdr" >> "$GITHUB_PATH"

      # hc (herdr-core) is pinned as herdr is: it is pre-1.0, and a new release
      # is taken on purpose, with new fixtures. The URL and digest are the
      # linux-x86_64 entry of the release's manifest.json on releases.herdr.dev.
      - name: Install hc
        env:
          HC_VERSION: 0.1.21
          HC_SHA256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL -o "$RUNNER_TEMP/hc.tar.gz" "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-linux-x86_64.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"

      # ubuntu-latest ships tmux and sh; herdr and hc come from the steps
      # above. Every tmux, herdr or hc test starts a private server on its own
      # socket and stops it in cleanup.
      - name: L4 live
        run: |
          tmux -V
          herdr --version
          hc --version
          CGO_ENABLED=1 go test -race -tags=live -timeout=300s ./...

      - name: build
        run: go build -o bin/revier ./cmd/revier

      # A broken .goreleaser.yaml fails here, not at release time. The version
      # is release.yml's; bump both together.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (pins go, goimports, golangci-lint)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # The format gate is defined once, in .mise.toml, and run from there -
      # never re-spelled as `gofmt`. goimports with -local also enforces the
      # import grouping plain gofmt has no opinion on, so a gofmt-shaped copy
      # accepts files the canonical gate rejects.
      - name: fmt-check
        run: mise run fmt:check

      - name: golangci-lint
        run: mise run lint

      # Reaches the network for the vulnerability database, so it runs here
      # rather than in the pre-commit gate.
      - name: vuln
        run: mise run vuln
